[project]
name = "production-test-spc"
version = "1.0.0"
description = "Statistical process control and applied statistics on a week of end-of-line test data"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
extend-exclude = ["tools/production_test_db_gen.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
